map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):       $ip::;
    default                            0.0.0.0;
}

# Access log with anonymised visitor IPs (last IPv4 octet / last 80 IPv6 bits
# removed), as stated in the privacy policy (/datenschutz).
log_format anonymized '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers, so redirects keep https behind Cloudflare.
    absolute_redirect off;
    client_max_body_size 64k;

    # Behind the Cloudflare Tunnel: take the visitor IP from CF-Connecting-IP,
    # but only for requests coming from the cloudflared container's network.
    set_real_ip_from 172.31.250.0/24;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/access.log anonymized;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's embedded DNS, so the backend can be resolved even if it starts later.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:9080;

    # API -> Jakarta EE backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pokédex live demo (separate Angular SPA with its own fallback)
    location = /demos/pokedex {
        return 301 /demos/pokedex/;
    }
    location /demos/pokedex/ {
        try_files $uri $uri/ /demos/pokedex/index.html;
        # German law: Impressum and privacy policy must be one click away on every page,
        # so the (third-party-built) demo gets a small fixed footer with both links.
        sub_filter_once on;
        sub_filter '</body>' '<nav aria-label="Legal" style="position:fixed;right:8px;bottom:8px;z-index:2147483647;font:12px/1.4 system-ui,sans-serif;background:rgba(255,255,255,.92);color:#111;padding:4px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2)"><a href="/impressum" style="color:inherit">Impressum</a> &middot; <a href="/datenschutz" style="color:inherit">Datenschutz</a></nav></body>';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback; never cache index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
