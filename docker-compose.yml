name: portfolio

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio}
      POSTGRES_USER: ${DB_USER:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Uncomment to reach the database from your host (e.g. psql, DBeaver):
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-portfolio}
      DB_USER: ${DB_USER:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:-portfolio}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-Ronald-Nguyen}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO_LIMIT: ${GITHUB_REPO_LIMIT:-10}
      GITHUB_REFRESH_HOURS: ${GITHUB_REFRESH_HOURS:-6}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      # Optional LLM answers (Mistral). The key only lives in .env, never in Git or the image.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODELS: ${MISTRAL_MODELS:-ministral-14b-latest,ministral-8b-latest,ministral-3b-latest}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-2}
      LLM_REQUESTS_PER_DAY: ${LLM_REQUESTS_PER_DAY:-300}
      LLM_TOKENS_PER_DAY: ${LLM_TOKENS_PER_DAY:-400000}
      LLM_REQUESTS_PER_CLIENT_HOUR: ${LLM_REQUESTS_PER_CLIENT_HOUR:-15}
      TRUST_FORWARDED_FOR: "true"
    # Bound to localhost only: from outside, the API is reachable solely through
    # the Nginx proxy, which sets X-Forwarded-For (so it cannot be spoofed).
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9080}:9080"
    healthcheck:
      test: ["CMD", "/opt/healthcheck.sh"]
      interval: 10s
      timeout: 6s
      start_period: 90s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
